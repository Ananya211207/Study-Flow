<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyFlow: Smart Study Planner</title>
<style>
:root{--bg:#f3f6f4;--sf:#fff;--tx:#14213d;--mu:#5d6a80;--ac:#2644d9;--on:#fff;--hl:#ffe14d;--mg:#e4572e;--bd:#cdd6d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--sf:#192131;--tx:#e7ecf5;--mu:#9aa6bd;--ac:#8aa0ff;--on:#10151f;--hl:#ffe14d;--mg:#ff7a52;--bd:#2c374c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--sf:#192131;--tx:#e7ecf5;--mu:#9aa6bd;--ac:#8aa0ff;--on:#10151f;--hl:#ffe14d;--mg:#ff7a52;--bd:#2c374c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:22px 18px 56px}
h1,h2,.big,.time{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:700}
h1{font-size:2rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--mu);margin:2px 0 20px;max-width:60ch}
.hero{background:var(--sf);border:2px solid var(--tx);border-radius:4px 18px 4px 18px;padding:18px 20px;box-shadow:5px 5px 0 var(--ac)}
.hero small,.t small{color:var(--mu);display:block}
.big{font-size:1.7rem;line-height:1.25;margin:6px 0;overflow-wrap:anywhere}
.big mark{background:var(--hl);color:#14213d;padding:0 .25em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sum{margin:14px 0 0;color:var(--mu)}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:28px;margin-top:22px;align-items:start}
@media(max-width:740px){.cols{grid-template-columns:1fr}}
h2{font-size:1.15rem;margin:0 0 10px}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--sf)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mg{border-left:3px solid var(--mg);padding-left:14px}
.add{margin-bottom:26px}
button{cursor:pointer;border:0;border-radius:6px;padding:10px 16px;background:var(--ac);color:var(--on);font-weight:600}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.task{display:flex;gap:10px;align-items:center;min-height:60px;padding:8px 0;border-bottom:1px solid var(--bd)}
.task input{width:auto}
.t{flex:1;min-width:0}.t b{display:block;overflow-wrap:anywhere}
.p{font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:3px;white-space:nowrap}
.High{background:var(--hl);color:#14213d}.Medium{border:1px solid var(--tx)}.Low{color:var(--mu);border:1px dashed var(--bd)}
.done .t b{text-decoration:line-through;opacity:.5}
.x{padding:4px 9px;background:transparent;color:var(--mu)}
.timer{border-top:3px solid var(--tx);padding-top:12px}
.time{font-size:3.6rem;line-height:1.1;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mu);padding:8px 0}
</style></head>
<body><div class="w">
<h1>StudyFlow</h1>
<p class="sub">Add your tasks and StudyFlow ranks them by deadline, difficulty and time needed, so you always know what to study first.</p>
<div class="hero" id="hero"></div>
<p class="sum" id="sum"></p>
<div class="cols">
 <div>
  <div class="add mg">
   <h2>Add a task</h2>
   <input id="ti" placeholder="Task, e.g. Finish DSA assignment" aria-label="Task">
   <div class="row"><input id="su" placeholder="Subject" aria-label="Subject"><input id="du" type="date" aria-label="Due date"></div>
   <div class="row">
    <select id="df" aria-label="Difficulty"><option value="1">Very easy</option><option value="2">Easy</option><option value="3" selected>Medium</option><option value="4">Hard</option><option value="5">Very hard</option></select>
    <input id="hr" type="number" min="0.5" step="0.5" placeholder="Hours needed" aria-label="Hours needed">
   </div>
   <button id="add" style="margin-top:12px">Add task</button>
  </div>
  <div class="mg"><h2>All tasks, ranked</h2><div id="list"></div></div>
 </div>
 <div class="timer">
  <h2 id="ms">Focus session</h2>
  <div class="time" id="tm">25:00</div>
  <div class="btns"><button id="go">Start</button><button class="g" id="rs">Reset</button><button class="g" id="md">Switch to break</button></div>
 </div>
</div></div>
<script>
const K='studyflow-v1',$=i=>document.getElementById(i);
let S={tasks:[],focus:{}};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(x){}
S.tasks=S.tasks||[];S.focus=S.focus||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const days=d=>d?Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5):14;
// Priority score: urgency (closer deadline = higher) + difficulty + workload
const score=t=>{const d=days(t.due);return(d<0?12:10/(d+1))+t.diff*1.2+Math.min(t.hrs,6)*.5};
const lvl=t=>{const s=score(t);return s>=9?'High':s>=5?'Medium':'Low'};
const due=t=>{if(!t.due)return'No deadline';const d=days(t.due);return d<0?'Overdue by '+(-d)+(d==-1?' day':' days'):d==0?'Due today':'Due in '+d+(d==1?' day':' days')};
function render(){
 const p=S.tasks.filter(t=>!t.done).sort((a,b)=>score(b)-score(a)),dn=S.tasks.filter(t=>t.done),top=p[0];
 $('hero').innerHTML=top?'<small>Start with this</small><div class="big"><mark>'+e(top.title)+'</mark></div><small>'+e(due(top))+', difficulty '+top.diff+' of 5, about '+top.hrs+' h of work</small>'+(p.length>1?'<small style="margin-top:8px">Then: '+p.slice(1,3).map(t=>e(t.title)).join(', ')+'</small>':''):'<small>No tasks yet</small><div class="big">Add your first task to get a study plan.</div>';
 $('sum').textContent=p.length+' pending, '+dn.length+' done, '+(S.focus[today()]||0)+' focus minutes today.';
 const row=t=>'<div class="task'+(t.done?' done':'')+'"><input type="checkbox" data-c="'+t.id+'"'+(t.done?' checked':'')+' aria-label="Mark done"><div class="t"><b>'+e(t.title)+'</b><small>'+e(t.sub||'General')+', '+(t.done?'completed':e(due(t)))+', '+t.hrs+' h</small></div>'+(t.done?'':'<span class="p '+lvl(t)+'">'+lvl(t)+'</span>')+'<button class="x" data-x="'+t.id+'" aria-label="Delete task">✕</button></div>';
 $('list').innerHTML=p.concat(dn).map(row).join('')||'<div class="empty">Nothing here yet. Add a task above.</div>';
}
$('add').onclick=()=>{const t=$('ti').value.trim();if(!t){$('ti').focus();return}
 S.tasks.push({id:Date.now(),title:t,sub:$('su').value.trim(),due:$('du').value,diff:+$('df').value,hrs:+$('hr').value||1,done:false});
 ['ti','su','du','hr'].forEach(i=>$(i).value='');save();render()};
$('ti').onkeydown=v=>{if(v.key==='Enter')$('add').click()};
$('list').onclick=v=>{const d=v.target.dataset;
 if(d.x)S.tasks=S.tasks.filter(t=>t.id!=d.x);
 else if(d.c){const t=S.tasks.find(t=>t.id==d.c);if(t)t.done=!t.done}else return;
 save();render()};
// Pomodoro timer: 25 min focus, 5 min break
let brk=false,left=1500,iv=null;
const fmt=()=>{$('tm').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')};
const mode=b=>{brk=b;left=b?300:1500;$('ms').textContent=b?'Break time':'Focus session';$('md').textContent=b?'Switch to focus':'Switch to break';fmt()};
const stop=()=>{clearInterval(iv);iv=null;$('go').textContent='Start'};
$('go').onclick=()=>{if(iv){stop();return}$('go').textContent='Pause';
 iv=setInterval(()=>{left--;fmt();if(left<=0){stop();if(!brk){S.focus[today()]=(S.focus[today()]||0)+25;save();render()}mode(!brk)}},1000)};
$('rs').onclick=()=>{stop();mode(brk)};
$('md').onclick=()=>{stop();mode(!brk)};
render();
</script></body></html>
